---
layout: default
title : Beyond Research
navbar_title: Beyond Research
---

<!-- Each section is a file in the `_hobbies` folder, ordered by `order`. -->

<div class="row">
    <div class="col-lg-10">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4 p-md-5">
                <div class="h3 mb-2">Beyond Research</div>
                <p class="text-muted mb-0">A few things I enjoy outside of work.</p>

                {% assign sections = site.hobbies | where: "show", true | sort: "order" %}
                {% for item in sections %}
                <hr class="my-4" />
                <h5 class="mb-3">{{ item.title }}</h5>
                <div class="text-profile-bio">
                    {{ item.content }}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
