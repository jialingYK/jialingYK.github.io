short_bio: >-
  <p>
    I am a Ph.D. student in Computer Science and Engineering at the University at Buffalo, advised by
    <a href="https://cse.buffalo.edu/~siweilyu/" target="_blank">Prof. Siwei Lyu</a>.
    My research focuses on AI-generated and manipulated media across images, videos, and audio, with an emphasis on
    multimedia forensics, interpretable detection, and real-world case analysis.
  </p>
  <p>
    Before my Ph.D., I earned my BA/MS in Econometrics and Quantitative Economics from the University at Buffalo.
  </p>
  <p class="mb-2"><strong>Research interests:</strong></p>
  <ul>
    <li>AI-generated and manipulated media analysis</li>
    <li>Multimodal media forensics across image, video, and audio</li>
    <li>Interpretable detection and human-AI forensic reasoning</li>
    <li>AI-generated music, speech, and audio authenticity</li>
  </ul>

